[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireboard-exporter"
version = "0.1.2"
description = "FireBoard2 temperature exporter for Grafana Cloud and/or InfluxDB"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "frbird" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.21.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "influxdb-client>=1.47.0",
  "python-snappy>=0.7.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "httpx>=0.27.0",
]

[project.scripts]
fireboard-exporter = "fireboard_exporter.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
