apiVersion: apps/v1
kind: Deployment
metadata:
  name: fireboard-exporter
  namespace: fireboard
  labels:
    app.kubernetes.io/name: fireboard-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fireboard-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fireboard-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fireboard-exporter
          image: ghcr.io/frbird/fireboard-exporter:0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fireboard-exporter
            - secretRef:
                name: fireboard-exporter
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
