apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fireboard-exporter
  namespace: fireboard
  labels:
    app.kubernetes.io/name: fireboard-exporter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fireboard-exporter
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
