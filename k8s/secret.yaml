# Copy to secret.yaml.local (gitignored) or create with kubectl.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: fireboard-exporter
  namespace: fireboard
  labels:
    app.kubernetes.io/name: fireboard-exporter
type: Opaque
stringData:
  FIREBOARD_TOKEN: "replace-me"
  # Optional Grafana Cloud remote_write
  # GRAFANA_REMOTE_WRITE_URL: "https://prometheus-prod-XX.../api/prom/push"
  # GRAFANA_REMOTE_WRITE_USERNAME: "instance-id"
  # GRAFANA_REMOTE_WRITE_TOKEN: "glc_..."
  # Optional Influx (when SINKS includes influx)
  # INFLUX_URL: "http://influxdb.influx.svc:8086"
  # INFLUX_TOKEN: "replace-me"
  # INFLUX_ORG: "home"
  # INFLUX_BUCKET: "fireboard"
